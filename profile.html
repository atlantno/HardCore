<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Профиль</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;}
        html,body {height:100%;overflow:hidden;background:#0a0a1a;color:#fff;touch-action:none;}
        .container {display:flex;flex-direction:column;min-height:100vh;width:100%;max-width:480px;margin:0 auto;padding:20px;background:linear-gradient(180deg,#0a0a1a,#1e1e3a);opacity:0;transition:opacity 0.5s ease-in;}
        .container.visible {opacity:1;}
        .nav-bar {width:100%;background:rgba(20,20,40,0.9);padding:12px;margin-bottom:24px;border-radius:16px;text-align:center;font-size:16px;font-weight:600;color:#e0e0e0;letter-spacing:0.5px;box-shadow:0 4px 15px rgba(0,0,0,0.2);backdrop-filter:blur(10px);}
        .profile-container {flex:1;display:flex;flex-direction:column;align-items:center;padding-bottom:80px;}
        .profile-photo {width:100px;height:100px;border-radius:50%;background:#7c3aed;margin-bottom:20px;object-fit:cover;}
        .profile-username {font-size:24px;font-weight:600;color:#7c3aed;margin-bottom:10px;}
        .profile-info {color:#a0a0c0;font-size:14px;text-align:center;}
        .navigation {position:fixed;bottom:0;left:0;width:100%;display:flex;justify-content:space-around;background:rgba(15,15,30,0.95);padding:12px 0;border-top:1px solid rgba(124,58,237,0.1);box-shadow:0 -4px 15px rgba(0,0,0,0.2);backdrop-filter:blur(10px);transition:transform 0.3s ease;}
        .nav-item {display:flex;flex-direction:column;align-items:center;color:#a0a0c0;transition:all 0.3s ease;cursor:pointer;}
        .nav-item.disabled {cursor:not-allowed;opacity:0.5;}
        .nav-item img {width:26px;height:26px;margin-bottom:4px;filter:brightness(0) invert(0.7);transition:all 0.3s ease;}
        .nav-text {font-size:12px;font-weight:500;}
        .nav-item.active {color:#7c3aed;}
        .nav-item.active img {filter:brightness(0) invert(1) drop-shadow(0 0 4px #7c3aed);}
        .fade-out {animation:fadeOut 0.3s ease forwards;}
        @keyframes fadeOut {from{opacity:1;}to{opacity:0;}}
    </style>
</head>
<body>
    <div class="container" id="mainContent">
        <div class="nav-bar">Профиль</div>
        <div class="profile-container">
            <img class="profile-photo" id="profilePhoto" src="" alt="Фото профиля"/>
            <div class="profile-username" id="profileUsername"></div>
            <div class="profile-info">Добро пожаловать в ваш профиль!</div>
        </div>
    </div>

    <div class="navigation">
        <div class="nav-item" id="leadersTab">
            <img src="https://i.postimg.cc/XNcpRsK6/free-icon-leaderboard-7132143.png" alt="Лидеры"/>
            <div class="nav-text">Лидеры</div>
        </div>
        <div class="nav-item" id="mainTab">
            <img src="https://i.postimg.cc/Bnw8htT8/free-icon-home-7102764.png" alt="Главная"/>
            <div class="nav-text">Главная</div>
        </div>
        <div class="nav-item active" id="profileTab">
            <img src="https://i.postimg.cc/Jzt0BmfR/free-icon-profile-3106773.png" alt="Профиль"/>
            <div class="nav-text">Профиль</div>
        </div>
    </div>

    <script>
        const mainContent = document.getElementById('mainContent');
        const profilePhoto = document.getElementById('profilePhoto');
        const profileUsername = document.getElementById('profileUsername');

        function initializeProfile() {
            mainContent.classList.add('visible');
            const urlParams = new URLSearchParams(window.location.search);
            const username = urlParams.get('username') || '@Player';
            const photo = urlParams.get('photo') || 'https://i.postimg.cc/Jzt0BmfR/free-icon-profile-3106773.png'; // Заглушка
            
            profileUsername.textContent = username;
            profilePhoto.src = photo;
        }

        document.querySelectorAll('img').forEach(img => {
            img.ondragstart = (event) => event.preventDefault();
        });

        initializeProfile();

        const navItems = document.querySelectorAll('.nav-item');
        navItems.forEach(item => {
            item.addEventListener('click', () => {
                if (item.classList.contains('active') || item.classList.contains('disabled')) return;

                navItems.forEach(nav => nav.classList.remove('active'));
                item.classList.add('active');

                mainContent.classList.add('fade-out');
                setTimeout(() => {
                    if (item.id === 'mainTab') {
                        window.location.href = 'https://atlantno.github.io/HardCore/index.html';
                    }
                }, 300);
            });
        });
    </script>
</body>
</html>
